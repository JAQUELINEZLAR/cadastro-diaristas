<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Diaristas - Zlar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #ffffff;
  padding: 20px;

}

  <script>
const cep = document.getElementById("cep");
const rua = document.getElementById("rua");
const bairro = document.getElementById("bairro");
const cidade = document.getElementById("cidade");
const estado = document.getElementById("estado");

cep.addEventListener("blur", () => {
  const valor = cep.value.replace(/\D/g, "");

  if (valor.length !== 8) {
    alert("CEP inválido");
    return;
  }

  fetch("https://viacep.com.br/ws/" + valor + "/json/")
    .then(response => response.json())
    .then(data => {
      if (data.erro) {
        alert("CEP não encontrado");
        return;
      }
      rua.value = data.logradouro;
      bairro.value = data.bairro;
      cidade.value = data.localidade;
      estado.value = data.uf;
    })
    .catch(() => alert("Erro ao buscar o CEP"));
});
</script>

/* Card do formulário */
form {
  background: #0b1d33;
  padding: 4px 10px 10px;
  border-radius: 9px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 10px 20px rgba(0,0,0,0.25);
}

.logo-container {
  display: flex;
  justify-content: center;
  margin: 0;
  padding: 0;
}

.logo-container img {
  width: 240px;
  height: auto;
  margin-top: -25px;
  display: block;
}

/* Títulos */
h2 {
  margin-top: -122px;
  padding: 0;
  text-align: center;
  color: #ffffff;
}

p {
  margin-top: 0;
  margin-bottom: 12px;
  text-align: center;
  color: #cbd5e1;
}

/* Inputs */
input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid #94a3b8;
  background: #f1f5ff;
}

input:focus {
  outline: none;
  border-color: #d4a857;
  background: #e8efff;
}

/* Botão */
button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  font-size: 16px;
  font-weight: bold;
  background: #d4a857;
  color: #0b1d33;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

button:hover {
  background: #c09847;
}
</style>
</head>

<body>

<form id="formulario">

  <div class="logo-container">
    <img src="logo.png" alt="Logo Zlar">
  </div>

  <h2>Cadastro de Diarista</h2>
  <p>Preencha seus dados</p>

  <input id="nome" placeholder="Nome completo" required>
  <input id="cpf" placeholder="CPF (somente números)" required>
  <input id="telefone" placeholder="Telefone / WhatsApp">
  <input id="email" placeholder="E-mail">
<input id="cep" placeholder="CEP" required>

  <!-- CEP (ADICIONADO) -->
  <input id="cep" placeholder="CEP" required>

  <!-- ENDEREÇO AUTOMÁTICO -->
  <input id="rua" placeholder="Rua" readonly>
  <input id="bairro" placeholder="Bairro" readonly>
  <input id="cidade" placeholder="Cidade" readonly>
  <input id="estado" placeholder="Estado" readonly>

  <input id="numero" placeholder="Número da casa" required>

  <button type="submit">Enviar cadastro</button>

</form>

<!-- SCRIPT APENAS DO CEP -->
<script>
const cep = document.getElementById("cep");
const rua = document.getElementById("rua");
const bairro = document.getElementById("bairro");
const cidade = document.getElementById("cidade");
const estado = document.getElementById("estado");

cep.addEventListener("blur", () => {
  const valor = cep.value.replace(/\D/g, "");

  if (valor.length !== 8) return;

  fetch("https://viacep.com.br/ws/" + valor + "/json/")
    .then(r => r.json())
    .then(d => {
      if (d.erro) return;
      rua.value = d.logradouro;
      bairro.value = d.bairro;
      cidade.value = d.localidade;
      estado.value = d.uf;
    });
});
</script>

</body>
</html>
