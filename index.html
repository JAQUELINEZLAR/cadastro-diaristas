<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Diaristas - Zlar</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  padding: 20px;
}

form {
  background: #fff;
  padding: 22px;
  border-radius: 12px;
  max-width: 420px;
  margin: auto;
}

.logo-container {
  text-align: center;
}

.logo-container img {
  max-width: 140px;
  margin-bottom: 10px;
}

h2 {
  text-align: center;
  margin-bottom: 4px;
  color: #0b1d33;
}

p {
  text-align: center;
  margin-bottom: 16px;
  color: #555;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  font-size: 15px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 16px;
  font-size: 16px;
  font-weight: bold;
  background: #d4a857;
  color: #0b1d33;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.success {
  display: none;
  margin-top: 15px;
  background: #e6f7ee;
  color: #1e7a4b;
  padding: 12px;
  text-align: center;
  border-radius: 8px;
  font-weight: bold;
}

.footer {
  text-align: center;
  margin-top: 20px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<form id="formulario">

  <div class="logo-container">
    <img src="logo.png" alt="Logo Zlar">
  </div>

  <h2>Cadastro de Diarista</h2>
  <p>Preencha seus dados</p>

  <input id="nome" placeholder="Nome completo" required>
  <input id="cpf" placeholder="CPF (somente números)" required>
  <input id="telefone" placeholder="Telefone / WhatsApp">
  <input id="email" placeholder="E-mail">

  <input id="cep" placeholder="CEP" required>
  <input id="rua" placeholder="Rua" readonly>
  <input id="bairro" placeholder="Bairro" readonly>
  <input id="cidade" placeholder="Cidade" readonly>
  <input id="estado" placeholder="Estado" readonly>

  <button type="submit">Enviar cadastro</button>

  <div class="success" id="successMsg">
    Cadastro enviado com sucesso 💛
  </div>

  <div class="footer">
    Zlar – Cuidando do Seu Lar
  </div>

</form>

<script>
const cep = document.getElementById("cep");
const rua = document.getElementById("rua");
const bairro = document.getElementById("bairro");
const cidade = document.getElementById("cidade");
const estado = document.getElementById("estado");
const cpf = document.getElementById("cpf");
const form = document.getElementById("formulario");
const successMsg = document.getElementById("successMsg");

cep.addEventListener("blur", () => {
  const v = cep.value.replace(/\D/g, "");
  if (v.length !== 8) return;

  fetch("https://viacep.com.br/ws/" + v + "/json/")
    .then(r => r.json())
    .then(d => {
      if (d.erro) return;
      rua.value = d.logradouro;
      bairro.value = d.bairro;
      cidade.value = d.localidade;
      estado.value = d.uf;
    });
});
