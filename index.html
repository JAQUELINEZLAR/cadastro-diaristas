<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Diaristas - Zlar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #ffffff;
  padding: 20px;
}

/* Card */
form {
  background: #0b1d33;
  padding: 4px 10px 10px;
  border-radius: 9px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 10px 20px rgba(0,0,0,0.25);
}

.logo-container {
  display: flex;
  justify-content: center;
}

.logo-container img {
  width: 240px;
  margin-top: -20px;
}

/* Títulos */
h2 {
  text-align: center;
  color: #ffffff;
  margin-top: -122px;
}

p {
  text-align: center;
  color: #cbd5e1;
  margin-bottom: 12px;
}

/* Inputs */
input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid #94a3b8;
  background: #f1f5ff;
}

input:focus {
  outline: none;
  border-color: #d4a857;
}

/* Botão */
button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  font-size: 16px;
  font-weight: bold;
  background: #d4a857;
  color: #0b1d33;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

button:hover {
  background: #c09847;
}

/* Mensagem */
.success {
  display: none;
  margin-top: 15px;
  padding: 12px;
  background: #e6f7ee;
  color: #1e7a4b;
  text-align: center;
  border-radius: 10px;
  font-weight: bold;
}

.footer {
  text-align: center;
  margin-top: 20px;
  color: #cbd5e1;
  font-size: 13px;
}
</style>
</head>

<body>

<form id="formulario">

  <div class="logo-container">
    <img src="logo.png" alt="Logo Zlar">
  </div>

  <h2>Cadastro de Diarista</h2>
  <p>Preencha seus dados</p>

  <input id="nome" placeholder="Nome completo" required>
  <input id="cpf" placeholder="CPF (somente números)" required>
  <input id="telefone" placeholder="Telefone / WhatsApp">
  <input id="email" placeholder="E-mail">

  <input id="cep" placeholder="CEP" required>
  <input id="rua" placeholder="Rua" readonly>
  <input id="bairro" placeholder="Bairro" readonly>
  <input id="cidade" placeholder="Cidade" readonly>
  <input id="estado" placeholder="Estado" readonly>

  <button type="submit">Enviar cadastro</button>

  <div class="success" id="successMsg">
    Cadastro enviado com sucesso 💛
  </div>

  <div class="footer">
    Zlar – Cuidando do Seu Lar
  </div>

</form>

<script>
// FORM
const form = document.getElementById("formulario");
const successMsg = document.getElementById("successMsg");

// INPUTS
const nome = document.getElementById("nome");
const cpf = document.getElementById("cpf");
const telefone = document.getElementById("telefone");
const email = document.getElementById("email");

const cep = document.getElementById("cep");
const rua = document.getElementById("rua");
const bairro = document.getElementById("bairro");
const cidade = document.getElementById("cidade");
const estado = document.getElementById("estado");

// VIA CEP
cep.addEventListener("blur", () => {
  const v = cep.value.replace(/\D/g, "");
  if (v.length !== 8) return;

  fetch(`https://viacep.com.br/ws/${v}/json/`)
    .then(r => r.json())
    .then(d => {
      if (d.erro) return;
      rua.value = d.logradouro || "";
      bairro.value = d.bairro || "";
      cidade.value = d.localidade || "";
      estado.value = d.uf || "";
    });
});

// CPF
function cpfValido(v) {
  v = v.replace(/\D/g, "");
  if (v.length !== 11 || /^(\d)\1+$/.test(v)) return false;

  let soma = 0;
  for (let i = 0; i < 9; i++) soma += v[i] * (10 - i);
  let resto = (soma * 10) % 11;
  if (resto === 10) resto = 0;
  if (resto != v[9]) return false;

  soma = 0;
  for (let i = 0; i < 10; i++) soma += v[i] * (11 - i);
  resto = (soma * 10) % 11;

  return resto == v[10];
}

// SUBMIT
form.addEventListener("submit", e => {
  e.preventDefault();

  if (!cpfValido(cpf.value)) {
    alert("CPF inválido");
    return;
  }

  const dados = {
    nome: nome.value,
    cpf: cpf.value,
    telefone: telefone.value,
    email: email.value,
    cep: cep.value,
    rua: rua.value,
    bairro: bairro.value,
    cidade: cidade.value,
    estado: estado.value
  };

  fetch("https://script.google.com/macros/s/AKfycbwAOvCEJntTvKKRyzBXnCnjiy47xG95a4630qGqVgfyJ5x4yXrP6be-7tGF6A3kd_8uwQ/exec", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(dados)
  })
  .then(r => r.text())
  .then(() => {
    successMsg.style.display = "block";
    form.reset();
  })
  .catch(err => {
    console.error(err);
    alert("Erro ao enviar formulário");
  });
});
</script>

</body>
</html>
