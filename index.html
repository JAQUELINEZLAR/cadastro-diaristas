<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Diaristas</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  padding: 15px;
}

form {
  background: #ffffff;
  padding: 20px;
  border-radius: 10px;
  max-width: 420px;
  margin: auto;
}

h2, p {
  text-align: center;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  font-size: 16px;
}

input {
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  background-color: #2e7d32;
  color: white;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<form id="formulario">
  <h2>Cadastro de Diarista</h2>
  <p>Preencha os dados abaixo</p>

  <input id="nome" placeholder="Nome completo" required>
  <input id="cpf" placeholder="CPF (somente números)" inputmode="numeric" required>
  <input id="telefone" placeholder="Telefone / WhatsApp">
  <input id="email" placeholder="E-mail">

  <input id="cep" placeholder="CEP" inputmode="numeric" required>

  <input id="rua" placeholder="Rua" readonly>
  <input id="bairro" placeholder="Bairro" readonly>
  <input id="cidade" placeholder="Cidade" readonly>
  <input id="estado" placeholder="Estado" readonly>

  <button type="submit">Enviar cadastro</button>
</form>

<script>
const cep = document.getElementById("cep");
const rua = document.getElementById("rua");
const bairro = document.getElementById("bairro");
const cidade = document.getElementById("cidade");
const estado = document.getElementById("estado");
const cpf = document.getElementById("cpf");
const formulario = document.getElementById("formulario");

cep.addEventListener("blur", () => {
  const c = cep.value.replace(/\D/g, "");
  if (c.length !== 8) return;

  fetch(`https://viacep.com.br/ws/${c}/json/`)
    .then(r => r.json())
    .then(d => {
      if (d.erro) return;
      rua.value = d.logradouro;
      bairro.value = d.bairro;
      cidade.value = d.localidade;
      estado.value = d.uf;
    });
});

function cpfValido(cpf) {
  cpf = cpf.replace(/\D/g, "");
  if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
  let s = 0;
  for (let i = 0; i < 9; i++) s += cpf[i] * (10 - i);
  let r = (s * 10) % 11;
  if (r === 10) r = 0;
  if (r != cpf[9]) return false;
  s = 0;
  for (let i = 0; i < 10; i++) s += cpf[i] * (11 - i);
  r = (s * 10) % 11;
  if (r === 10) r = 0;
  return r == cpf[10];
}

formulario.addEventListener("submit", e => {
  e.preventDefault();
  if (!cpfValido(cpf.value)) {
    alert("CPF inválido");
    return;
  }
  alert("Cadastro enviado com sucesso!");
});
</script>

</body>
</html>
