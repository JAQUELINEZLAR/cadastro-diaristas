<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Diaristas - Zlar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #f4f6f8, #e9edf2);
}

/* Card */
.form-card {
  background: #ffffff;
  max-width: 420px;
  margin: auto;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.12);
}

/* Títulos */
h2 {
  text-align: center;
  color: #0b1d33;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  color: #555;
  margin-bottom: 20px;
}

/* Inputs */
input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  font-size: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
}

input:focus {
  outline: none;
  border-color: #0b1d33;
  box-shadow: 0 0 0 2px rgba(11,29,51,0.15);
}

/* Botão */
button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  font-size: 16px;
  font-weight: bold;
  background: #d4a857;
  color: #0b1d33;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #c09847;
}

/* Mensagem sucesso */
.success {
  display: none;
  margin-top: 18px;
  padding: 15px;
  background: #e6f7ee;
  color: #1e7a4b;
  text-align: center;
  border-radius: 12px;
  font-weight: bold;
}

/* Rodapé */
.footer {
  text-align: center;
  margin-top: 25px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="form-card">

  <h2>Cadastro de Diarista</h2>
  <div class="subtitle">Preencha seus dados abaixo</div>

  <form id="formulario">
    <input id="nome" placeholder="Nome completo" required>
    <input id="cpf" placeholder="CPF (somente números)" required inputmode="numeric">
    <input id="telefone" placeholder="Telefone / WhatsApp" inputmode="tel">
    <input id="email" placeholder="E-mail" inputmode="email">

    <input id="cep" placeholder="CEP" required inputmode="numeric">
    <input id="rua" placeholder="Rua" readonly>
    <input id="bairro" placeholder="Bairro" readonly>
    <input id="cidade" placeholder="Cidade" readonly>
    <input id="estado" placeholder="Estado" readonly>

    <button type="submit">Enviar cadastro</button>

    <div class="success" id="successMsg">
      Cadastro enviado com sucesso 💛
    </div>
  </form>

  <div class="footer">
    Zlar – Cuidando do Seu Lar
  </div>

</div>

<script>
const cep = document.getElementById("cep");
const rua = document.getElementById("rua");
const bairro = document.getElementById("bairro");
const cidade = document.getElementById("cidade");
const estado = document.getElementById("estado");
const cpf = document.getElementById("cpf");
const form = document.getElementById("formulario");
const successMsg = document.getElementById("successMsg");

/* Busca CEP */
cep.addEventListener("blur", () => {
  const v = cep.value.replace(/\D/g, "");
  if (v.length !== 8) return;

  fetch(`https://viacep.com.br/ws/${v}/json/`)
    .then(r => r.json())
    .then(d => {
      if (d.erro) return;
      rua.value = d.logradouro;
      bairro.value = d.bairro;
      cidade.value = d.localidade;
      estado.value = d.uf;
    });
});

/* Validação CPF */
function cpfValido(cpf) {
  cpf = cpf.replace(/\D/g, "");
  if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

  let soma = 0;
  for (let i = 0; i < 9; i++) soma += cpf[i] * (10 - i);
  let resto = (soma * 10) % 11;
  if (resto === 10) resto = 0;
  if (resto != cpf[9]) return false;

  soma = 0;
  for (let i = 0; i < 10; i++) soma += cpf[i] * (11 - i);
  resto = (soma * 10) % 11;
  if (resto === 10) resto = 0;

  return resto == cpf[10];
}

/* Envio */
form.addEventListener("submit", e => {
  e.preventDefault();

  if (!cpfValido(cpf.value)) {
    alert("CPF inválido. Verifique.");
    return;
  }

  successMsg.style.display = "block";
  form.reset();

  setTimeout(() => {
    successMsg.style.display = "none";
  }, 4000);
});
</script>

</body>
</html>
