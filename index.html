<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Diaristas</title>

  <style>
    body {
  font-family: Arial, sans-serif;
  background: #f4f6f8; /* fundo claro */
  padding: 20px;
}

    }

  form {
  background: #ffffff;
  padding: 25px;
  border-radius: 12px;
  max-width: 420px;
  margin: auto;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
}
    }

    .logo-container {
      text-align: center;
    }

    .logo-container img {
      max-width: 150px;
      margin-bottom: 10px;
    }

   h2 {
  text-align: center;
  color: #0b1d33; /* azul escuro */
}

    p {
  text-align: center;
  color: #555;
}

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
      border-radius: 8px;
    }

   button {
  background: #0b1d33;
  color: #d4a857;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #081526;
}
input:focus {
  outline: none;
  border-color: #0b1d33;
  box-shadow: 0 0 0 2px rgba(11, 29, 51, 0.15);
}

    }
  </style>
</head>

<body>

  <form id="formulario">

    <!-- LOGO -->
    <div class="logo-container">
      <img src="logo.png" alt="Logo ZLAR">
    </div>

    <h2>Cadastro de Diarista</h2>
    <p>Preencha seus dados</p>

    <input id="nome" placeholder="Nome completo" required>
    <input id="cpf" placeholder="CPF (somente números)" required>
    <input id="telefone" placeholder="Telefone / WhatsApp">
    <input id="email" placeholder="E-mail">

    <input id="cep" placeholder="CEP" required>

    <input id="rua" placeholder="Rua" readonly>
    <input id="bairro" placeholder="Bairro" readonly>
    <input id="cidade" placeholder="Cidade" readonly>
    <input id="estado" placeholder="Estado" readonly>

    <button type="submit">Enviar cadastro</button>
  </form>

  <script>
    const cep = document.getElementById("cep");
    const rua = document.getElementById("rua");
    const bairro = document.getElementById("bairro");
    const cidade = document.getElementById("cidade");
    const estado = document.getElementById("estado");
    const cpf = document.getElementById("cpf");
    const formulario = document.getElementById("formulario");

    cep.addEventListener("blur", () => {
      const valor = cep.value.replace(/\D/g, "");
      if (valor.length !== 8) return;

      fetch("https://viacep.com.br/ws/" + valor + "/json/")
        .then(response => response.json())
        .then(data => {
          if (data.erro) return;
          rua.value = data.logradouro;
          bairro.value = data.bairro;
          cidade.value = data.localidade;
          estado.value = data.uf;
        });
    });

    function cpfValido(cpf) {
      cpf = cpf.replace(/\D/g, "");
      if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

      let soma = 0;
      for (let i = 0; i < 9; i++) soma += cpf[i] * (10 - i);
      let resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;
      if (resto != cpf[9]) return false;

      soma = 0;
      for (let i = 0; i < 10; i++) soma += cpf[i] * (11 - i);
      resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;

      return resto == cpf[10];
    }

    formulario.addEventListener("submit", (e) => {
      e.preventDefault();

      if (!cpfValido(cpf.value)) {
        alert("CPF inválido");
        return;
      }

      alert("Cadastro enviado com sucesso!");
    });
  </script>

</body>
</html>
