<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Diaristas - Zlar</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #f4f6f8, #e9edf2);
  padding: 20px;
}

/* Card do formulário */
form {
  background: #ffffff;
  padding: 28px;
  border-radius: 16px;
  max-width: 420px;
  margin: auto;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
}

/* Logo */
.logo-container {
  text-align: center;
  margin-bottom: 10px;
}

.logo-container img {
  max-width: 140px;
}

/* Títulos */
h2 {
  text-align: center;
  color: #0b1d33;
  margin-bottom: 5px;
}

p {
  text-align: center;
  color: #555;
  margin-bottom: 20px;
}

/* Campos */
input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  font-size: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
  transition: 0.3s;
}

/* Efeito ao clicar */
input:focus {
  outline: none;
  border-color: #0b1d33;
  box-shadow: 0 0 0 2px rgba(11, 29, 51, 0.15);
}

/* Botão */
button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  font-size: 16px;
  font-weight: bold;
  background: #0b1d33;
  color: #d4a857;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #081526;
}
</style>
</head>
